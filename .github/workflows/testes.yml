# Roda os testes automáticos a cada envio para o GitHub (push) e em todo pull request.
name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: python -m pytest
