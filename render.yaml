# Publicação no Render (render.com) direto do GitHub.
# A senha inicial do painel é digitada no Render na hora de criar, nunca aqui.
# O endereço público vem sozinho do Render (RENDER_EXTERNAL_URL). Com domínio próprio, defina PUBLIC_BASE_URL.
services:
  - type: web
    name: numelhor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: dono
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        sync: false
