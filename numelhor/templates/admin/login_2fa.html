{% extends "admin/base.html" %}
{% block title %}Verificação{% endblock %}
{% block bare %}
<div class="auth-wrap">
  <form method="post" class="panel auth-card">
    <img class="logo" src="{{ url_for('static', filename='img/logo.webp') }}" alt="NuMelhor">
    <h1>Código de verificação</h1>
    <p class="muted" style="text-align:center">Abra o app autenticador (Google Authenticator, Authy…) e digite o código de 6 dígitos.</p>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="code">Código</label>
      <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*" required autofocus>
    </div>
    <button class="btn btn-yellow btn-lg btn-block" type="submit">Confirmar</button>
  </form>
</div>
{% endblock %}
